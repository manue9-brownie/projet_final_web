<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | SGM</title>
    <link rel="stylesheet" th:href="@{/sgm.css}" href="/sgm.css">
</head>
<body class="login-page">
<main class="login-card">
    <div class="login-brand">
        <span class="brand-shield"><span>+</span><i></i></span>
        <h1>SGM</h1>
        <p>Sistema de Gestão de Medicamentos</p>
    </div>
    <p th:if="${param.erro}" style="color:#c54848;text-align:center">E-mail ou senha incorretos.</p>
    <p th:if="${param.registrado}" style="color:#13814d;text-align:center">Conta criada. Faça login.</p>
    <form th:action="@{/login}" method="post">
        <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" placeholder="Digite seu e-mail" required></div>
        <div class="field"><label for="senha">Senha</label><input id="senha" name="senha" type="password" autocomplete="current-password" placeholder="Digite sua senha" required></div>
        <button class="button" type="submit">Entrar</button>
    </form>
    <p class="login-register" style="text-align:center">Ainda não tem conta? <a th:href="@{/registrar}">Cadastre-se</a></p>
    <p class="login-footer">SGM - Sistema de Gestão de Medicamentos<br>© 2026 · Todos os direitos reservados.</p>
</main>
</body>
</html>
