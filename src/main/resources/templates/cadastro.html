<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Novo medicamento | SGM</title><link rel="stylesheet" th:href="@{/sgm.css}" href="/sgm.css">
</head>
<body>
<aside th:replace="~{fragments :: sidebar('medicamentos')}"></aside>
<div class="main-column"><header th:replace="~{fragments :: topbar}"></header>
    <main class="page-content">
        <div class="page-heading"><div><p class="eyebrow">Medicamentos</p><h1><span class="heading-icon">＋</span>Cadastro de Medicamentos</h1><p>Preencha os dados para cadastrar um novo medicamento no sistema.</p></div></div>
        <section class="card form-card">
            <p class="form-intro">Os campos marcados com <em style="color:#e14e60">*</em> são obrigatórios.</p>
            <p role="alert" th:if="${erro}" th:text="${erro}" style="color:#c54848;font-size:11px"></p>
            <form action="/salvar" method="post">
                <div class="form-grid">
                    <div class="field"><label for="nome">Nome do medicamento <em>*</em></label><input id="nome" name="nome" type="text" placeholder="Digite o nome do medicamento" required></div>
                    <div class="field"><label for="principioAtivo">Princípio ativo</label><input id="principioAtivo" name="principioAtivo" type="text" placeholder="Ex.: Losartana"></div>
                    <div class="field"><label for="validade">Validade</label><input id="validade" name="validade" type="date"></div>
                    <div class="field"><label for="quantidade">Quantidade em estoque <em>*</em></label><input id="quantidade" name="quantidade" type="number" min="0" placeholder="Ex.: 30" required></div>
                    <div class="field full"><label for="horario">Horário de uso</label><input id="horario" name="horario" type="time"><span class="form-hint">Informe o horário recomendado para tomar o medicamento.</span></div>
                </div>
                <div class="form-actions"><a class="button secondary" th:href="@{/lista}">Cancelar</a><button class="button" type="submit">▣&nbsp; Salvar medicamento</button></div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
